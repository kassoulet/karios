name: Test Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
    
    - name: Test plugin import
      shell: pwsh
      run: |
        cd ${{ github.workspace }}
        python -c "from karios_qgis import KariosQGISPlugin; print('✓ Plugin imports')"
    
    - name: Test dependency checker
      shell: pwsh
      run: |
        cd ${{ github.workspace }}
        python -c "from dependency_checker import DependencyChecker; print('✓ Dependency checker imports')"
    
    - name: Test auto-install simulation
      shell: pwsh
      run: |
        cd ${{ github.workspace }}
        python tests/test_install.py
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: |
          test-results.xml
          *.log
