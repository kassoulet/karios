name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: karios
        python-version: ${{ matrix.python-version }}
        auto-activate-base: false

    - name: Install dependencies
      run: |
        pip install -e .
        pip install -r requirements_dev.txt
        # Install tools needed for pre-commit checks
        pip install black isort bandit pydocstyle pre-commit vermin

    - name: Run license headers check
      run: |
        python -c "import licenseheaders; print('licenseheaders available')"
        # Check if license headers are properly applied
        python -m licenseheaders -cy -o "Telespazio France" -n "KARIOS" -t apache-2.tmpl -u "https://github.com/telespazio-tim/karios" -d karios --checkonly .
      continue-on-error: true

    - name: Run import sorting check (isort)
      run: |
        isort --check-only .

    - name: Run code formatting check (black)
      run: |
        black -l 100 --check .

    - name: Run security check (bandit)
      run: |
        bandit .

    - name: Check Python 3.8+ syntax compatibility (vermin)
      run: |
        # --eval-annotations actually inspects type-hint syntax (PEP 585
        # builtin generics, PEP 604 unions) instead of vermin's lenient
        # default, which would otherwise pass without noticing them.
        # This currently fails: the package uses 3.9+ syntax throughout and
        # declares requires-python >=3.12 in pyproject.toml. Kept as a
        # non-blocking signal of the gap rather than gating merges on a
        # 3.8-compatibility effort nobody has undertaken yet.
        vermin --eval-annotations --target=3.8 --violations --no-tips karios/
      continue-on-error: true
