name: Test Linux

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        qgis-version: [release-3_28, release-3_34, latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Test with QGIS ${{ matrix.qgis-version }}
      run: |
        echo "========================================"
        echo "Testing with QGIS ${{ matrix.qgis-version }}"
        echo "========================================"
        
        # Run tests in QGIS Docker container
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          qgis/qgis:${{ matrix.qgis-version }} \
          bash -c "
            cd /workspace &&
            python3 tests/test_install.py &&
            python3 tests/test_dependencies.py
          "
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-${{ matrix.qgis-version }}
        path: |
          test-results.xml
          *.log
