name: install-tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks that need no QGIS: Qt5-only enums that break on QGIS 4 / Qt6.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/check_qt6_enums.py

  # Dependency packs: OpenCV, pandas, scikit-image and friends (compiled, so one pack per platform and Python),
  # downloaded by the plugin at first run. numpy/scipy/matplotlib/GDAL come from QGIS. Pythons: QGIS 3 ships
  # 3.9-3.13, QGIS 4 3.12-3.14.
  # No macOS arm64 pack for now (no hosted arm64 runner available). tags = wheel platform tags for pip (macos-15 / ubuntu-22.04 = oldest available runners, widest compatibility)
  packs:
    name: packs (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x64, tags: "manylinux2014_x86_64 manylinux_2_28_x86_64"}
          - {os: windows-latest, platform: win-x64, tags: "win_amd64"}
          - {os: macos-15-intel, platform: macos-x64, tags: "macosx_10_13_x86_64 macosx_10_15_x86_64 macosx_11_0_x86_64 macosx_12_0_x86_64 macosx_13_0_x86_64 macosx_14_0_x86_64 macosx_15_0_x86_64"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python tools/build_zip.py packs packs ${{ matrix.platform }} 3.9,3.10,3.11,3.12,3.13,3.14 ${{ matrix.tags }} | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l packs
      - uses: actions/upload-artifact@v4
        with:
          name: packs-${{ matrix.platform }}
          path: packs/*.zip

  # The plugin zip users install: no dependencies inside, deps-sha256.txt lists the packs of every platform.
  package:
    needs: packs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          path: packs
          merge-multiple: true
      - run: |
          V=$(grep '^version=' metadata.txt | cut -d= -f2)
          python3 tools/build_zip.py plugin "out/karios_qgis-$V.zip" packs
          python3 tests/check_zip.py out/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: out/*.zip

  # conda-forge QGIS 3 and 4 on Linux, Windows and macOS (arm64 + intel). The environment has no OpenCV and
  # no scikit-image: the plugin must get them from its zip's dependency pack (served locally, standing in for
  # the GitHub release), then run the processing on the sample images.
  install:
    name: install (${{ matrix.os }}, qgis${{ matrix.qgis }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-15-intel]
        qgis: ["3", "4"]
        exclude:
          - {os: macos-15-intel, qgis: "4"}  # no conda-forge QGIS 4 for Intel Macs
        include:  # which dependency pack each runner tests
          - {os: ubuntu-22.04, platform: linux-x64}
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: windows-latest, platform: win-x64}
          - {os: macos-15-intel, platform: macos-x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # the sample images
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: karios
      - name: Install QGIS
        run: |
          # same environment as the image-quality-toolset CI (scikit-image and pip in the solve: conda-forge QGIS
          # on Windows failed to load its DLLs without them), then take out what the zip must bring
          conda install -y "qgis=${{ matrix.qgis }}.*" numpy scipy matplotlib scikit-image pip
          pip uninstall -y scikit-image imageio tifffile lazy_loader networkx
          conda list | grep -i -E "^(qgis|python|numpy|libgdal|gdal|proj|opencv|scikit-image|pandas) " || true
          if python -c "import cv2" 2>/dev/null || python -c "import skimage" 2>/dev/null; then echo "OpenCV or scikit-image still in the environment: cannot test the pack" >&2; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: packs-${{ matrix.platform }}
          path: packs
      - name: Test the plugin zip (start the plugin, run the processing)
        env:
          QT_QPA_PLATFORM: offscreen
          KARIOS_PACK_BASE_URL: http://127.0.0.1:18431
        run: |
          # conda-forge qgis on Windows keeps its Python bindings under Library/
          if [ "$RUNNER_OS" = Windows ]; then
            export PYTHONPATH="$CONDA_PREFIX\\Library\\python;$CONDA_PREFIX\\Library\\python\\plugins"
            export QGIS_PREFIX_PATH="$CONDA_PREFIX\\Library"
          fi
          mkdir unzipped
          python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('out/*.zip')[0]).extractall('unzipped')"
          python -m http.server 18431 --bind 127.0.0.1 --directory packs > /dev/null 2>&1 &
          SERVER=$!
          export KARIOS_PLUGIN_PARENT="$PWD/unzipped"
          python tests/test_install.py
          python tests/test_algorithms.py
          kill $SERVER

  # Every dependency pack imports under its Python on the real OS (no QGIS: numpy and scipy from PyPI).
  bundle-compat:
    name: bundle-compat (${{ matrix.platform }}, python ${{ matrix.python }})
    needs: packs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: ubuntu-22.04, platform: linux-x64}
          - {os: windows-latest, platform: win-x64}
          - {os: macos-15-intel, platform: macos-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: packs-${{ matrix.platform }}
          path: packs
      - run: python -m pip install numpy scipy
      - run: python tests/check_bundle_imports.py packs/*.zip
        shell: bash

  # QGIS from the qgis.org apt repository with the system Python and no pip: what most Linux users have.
  # Not blocking until it has passed once.
  apt:
    name: apt (${{ matrix.channel }})
    needs: package
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel: [ltr, latest]   # https://qgis.org/ubuntu-ltr and https://qgis.org/ubuntu
    env:
      QT_QPA_PLATFORM: offscreen
      KARIOS_PACK_BASE_URL: http://127.0.0.1:18431
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install QGIS from apt
        run: |
          [ "${{ matrix.channel }}" = ltr ] && REPO=ubuntu-ltr || REPO=ubuntu
          sudo mkdir -m755 -p /etc/apt/keyrings
          sudo wget -q --tries=6 --waitretry=20 --retry-connrefused --retry-on-http-error=429,500,502,503,504 -O /etc/apt/keyrings/qgis-archive-keyring.gpg https://download.qgis.org/downloads/qgis-archive-keyring.gpg
          printf 'Types: deb\nURIs: https://qgis.org/%s\nSuites: noble\nArchitectures: amd64\nComponents: main\nSigned-By: /etc/apt/keyrings/qgis-archive-keyring.gpg\n' "$REPO" \
            | sudo tee /etc/apt/sources.list.d/qgis.sources
          sudo apt-get -o Acquire::Retries=6 update
          sudo apt-get -o Acquire::Retries=6 install -y qgis python3-qgis python3-numpy python3-scipy python3-matplotlib
      - name: QGIS version
        run: |
          export PYTHONPATH=/usr/share/qgis/python
          /usr/bin/python3 -c "from qgis.core import Qgis; print(Qgis.version())" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: packs-linux-x64
          path: packs
      - name: Test the plugin zip with the system Python
        run: |
          export PYTHONPATH=/usr/share/qgis/python
          mkdir unzipped
          /usr/bin/python3 -c "import glob,zipfile; zipfile.ZipFile(glob.glob('out/*.zip')[0]).extractall('unzipped')"
          /usr/bin/python3 -m http.server 18431 --bind 127.0.0.1 --directory packs > /dev/null 2>&1 &
          SERVER=$!
          export KARIOS_PLUGIN_PARENT="$PWD/unzipped"
          /usr/bin/python3 tests/test_install.py
          /usr/bin/python3 tests/test_algorithms.py
          kill $SERVER

  # The official QGIS 4 image (qgis/qgis:latest, Qt6, Python 3.14): the plugin zip with the linux-x64 pack.
  qgis4:
    name: qgis4 (official docker image)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: packs-linux-x64
          path: packs
      - name: Test the plugin zip with QGIS 4
        run: |
          docker run --rm -v "$PWD":/w -w /w -e QT_QPA_PLATFORM=offscreen -e KARIOS_PACK_BASE_URL=http://127.0.0.1:18431 \
            qgis/qgis:latest bash -c '
              set -e
              python3 -c "from qgis.core import Qgis; print(Qgis.version())" | tee -a /w/qgis-version.txt
              apt-get update -qq && apt-get install -y -qq python3-scipy >/dev/null  # not in the image
              mkdir unzipped
              python3 -c "import glob,zipfile; zipfile.ZipFile(glob.glob(\"out/*.zip\")[0]).extractall(\"unzipped\")"
              python3 -m http.server 18431 --bind 127.0.0.1 --directory packs > /dev/null 2>&1 &
              export KARIOS_PLUGIN_PARENT=/w/unzipped
              python3 tests/test_install.py
              python3 tests/test_algorithms.py'
          cat qgis-version.txt >> "$GITHUB_STEP_SUMMARY"

  # On a tag vX.Y.Z: attach the plugin zip and the dependency packs the plugin downloads (the URL contains vX.Y.Z).
  release:
    needs: [lint, install, qgis4, bundle-compat, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{packs-*,plugin-zip}"
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version=' metadata.txt | cut -d= -f2)
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME does not match metadata version $V" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes
